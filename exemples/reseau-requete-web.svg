<path class="net-device" d="M48,431H142L150,442H40Z"/>

<!-- Box -->
<path class="net-device-line" d="M237,406L231,388M273,406L279,388"/>
<rect class="net-device" x="225" y="406" width="60" height="28" rx="4"/>
<circle class="net-led" cx="238" cy="420" r="2.5"/>
<circle class="net-led" cx="248" cy="420" r="2.5"/>
<circle class="net-led" cx="258" cy="420" r="2.5"/>

