<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorize</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f4f8">
<link rel="stylesheet" href="style.css">
</head>
<body class="source-hidden">

<div class="header">
  <h1>Memo<span>rize</span></h1>

  <div class="toolbar">
    <div class="source-actions">
      <label class="file-btn" for="fileInput">Charger un fichier .txt / .md / .svg</label>
      <input type="file" id="fileInput" accept=".txt,.md,.svg">
      <select class="file-btn" id="exampleSelect" title="Charger un exemple">
        <option value="">Exemples…</option>
        <option value="exemples/departements.md">Départements français (markdown)</option>
        <option value="exemples/carte-france.svg">Départements français (carte)</option>
        <option value="exemples/carte-usa.svg">États américains (carte)</option>
        <option value="exemples/carte-italie.svg">Régions italiennes (carte)</option>
        <option value="exemples/carte-allemagne.svg">Länder allemands (carte)</option>
        <option value="exemples/carte-suisse.svg">Cantons suisses (carte)</option>
        <option value="exemples/carte-autriche.svg">Länder autrichiens (carte)</option>
        <option value="exemples/carte-espagne.svg">Communautés autonomes espagnoles (carte)</option>
        <option value="exemples/oiseaux-manche.svg">Oiseaux marins de la Manche (images)</option>
        <option value="exemples/poissons-manche.svg">Poissons marins de la Manche (images)</option>
        <option value="exemples/feuilles-arbres.svg">Feuilles des arbres (planche)</option>
        <option value="exemples/fleurs.svg">Fleurs (planche)</option>
        <option value="exemples/reseau-requete-web.svg">Requête web, du PC au serveur (planche)</option>
        <option value="exemples/tableau-periodique.svg">Tableau périodique (planche)</option>
        <option value="exemples/elements.md">Tableau périodique (markdown)</option>
        <option value="exemples/constantes.md">Constantes physiques (markdown)</option>
        <option value="exemples/ordres-de-grandeur.md">Ordres de grandeur des longueurs (markdown)</option>
        <option value="exemples/ordres-de-grandeur-temps.md">Ordres de grandeur du temps (markdown)</option>
        <option value="exemples/histoire.md">Histoire mondiale, 100 dates (markdown)</option>
        <option value="exemples/philosophes.md">Philosophes et concepts (markdown)</option>
        <option value="exemples/allemand.md">Allemand, de A1 aux films (markdown)</option>
        <option value="exemples/anglais.md">Anglais, de B2 aux films (markdown)</option>
        <option value="exemples/papiers-ia.md">Articles fondateurs de l'IA (markdown)</option>
        <option value="exemples/architectures-ia.md">Architectures en IA (markdown)</option>
        <option value="exemples/maths-ia.md">Bases mathématiques de l'IA (markdown)</option>
        <option value="exemples/equations.md">Équations IA et contrôle (markdown)</option>
        <option value="exemples/equations-rl.md">Équations du RL et du deep RL (markdown)</option>
        <option value="exemples/equations-physique.md">Équations de la physique (markdown)</option>
        <option value="exemples/leetcode.md">LeetCode, 100 problèmes (markdown)</option>
      </select>
    </div>
    <button class="file-btn hide-btn active" id="hideSourceBtn" title="Afficher le texte source">Afficher source</button>
  </div>

  <div class="theme-toggle" id="themeToggle" title="Changer de thème">
    <span class="icon">☀️</span>
    <div class="toggle-track" id="toggleTrack">
      <div class="toggle-thumb"></div>
    </div>
    <span class="icon">🌙</span>
  </div>
</div>

<div class="workspace">
<div class="slider-wrap">
  <label>Difficulté</label>
  <div class="slider-track">
    <input type="range" id="slider" min="0" max="200" value="0" step="1">
  </div>
  <div class="difficulty-value" id="diffVal">0.00</div>
</div>

<div class="layout">
  <div class="panel" id="sourcePanel">
    <div class="panel-label">Texte source</div>
    <textarea id="input" spellcheck="false" placeholder="Collez ou chargez votre texte ici…"></textarea>
    <div class="stats" id="statsIn"></div>
  </div>

  <div class="panel">
    <div class="panel-label">Résultat</div>
    <div class="output-box">
      <div id="output"></div>
      <div class="zoom-controls" id="zoomControls" hidden>
        <button class="file-btn" id="zoomIn" title="Zoomer">+</button>
        <button class="file-btn" id="zoomOut" title="Dézoomer">−</button>
      </div>
      <div class="depth-controls" id="depthControls" hidden>
        <label for="depthSlider">Profondeur</label>
        <div class="depth-track">
          <input type="range" id="depthSlider" min="0" max="100" value="0" step="1">
          <div class="depth-ticks" id="depthTicks"></div>
        </div>
        <span id="depthLabel"></span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stats" id="statsOut"></div>
      <div class="view-controls" id="viewControls" hidden>
        <div class="level-controls" id="levelControls" hidden></div>
        <button class="view-btn" id="swapBtn" aria-pressed="false" aria-label="Permuter" title="Permuter : masquer la première colonne, laisser le reste visible">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h11M10 2l3 3-3 3M14 11H3M6 8l-3 3 3 3"/></svg>
        </button>
        <button class="view-btn" id="shuffleBtn" aria-pressed="false" aria-label="Mélanger" title="Mélanger les lignes">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4h3l7 8h4M1 12h3l2-2.3M9 6.3 11 4h4M13 2l2 2-2 2M13 10l2 2-2 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
  // MathJax : pas de rendu automatique, app.js convertit TeX → MathML → SVG à chaque rendu
  window.MathJax = {
    svg: { fontCache: 'none' },
    startup: {
      typeset: false,
      ready: () => {
        MathJax.startup.defaultReady();
        // Sans typeset automatique, la feuille de style MathJax n'est jamais injectée :
        // le MathML d'accessibilité s'affiche alors en double et les blocs ne sont pas centrés
        document.head.appendChild(MathJax.svgStylesheet());
        MathJax.startup.promise.then(() => render());
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-svg.js"></script>
<script>
  // Service worker requis pour l'installation PWA (HTTPS ou localhost uniquement)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
